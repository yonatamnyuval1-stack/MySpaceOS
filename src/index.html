<!DOCTYPE html>
<html lang="en" dir="ltr" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Space</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0e14;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      html.booting .shell {
        visibility: hidden;
      }
      html.boot-splash-skip .boot-splash {
        display: none;
      }
      html.boot-splash-skip.booting .shell {
        visibility: visible;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.15rem;
        background: #0a0e14;
      }
      .boot-splash-stage {
        position: relative;
        width: 112px;
        height: 112px;
        display: grid;
        place-items: center;
      }
      .boot-splash-logo {
        position: relative;
        z-index: 1;
        width: 64px;
        height: 64px;
        object-fit: contain;
        opacity: 0.92;
      }
      .boot-splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 250deg,
          rgba(120, 210, 240, 0.08) 280deg,
          rgba(140, 220, 245, 0.55) 318deg,
          rgba(120, 210, 240, 0.1) 348deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
        animation: boot-spill-spin 5s linear infinite;
      }
      .boot-splash-pct {
        margin: 0;
        min-width: 3.5ch;
        text-align: center;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
        color: #8fd6ef;
      }
      @keyframes boot-spill-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="shell-atlas.css" />
    <script>
      (function () {
        if (new URLSearchParams(location.search).get("secondary") === "1") {
          document.documentElement.classList.add("boot-splash-skip");
          document.documentElement.classList.remove("booting");
          return;
        }
        window.__bootSplashStartedAt = performance.now();
        window.__bootSplashReady = false;
        function tickBootPct() {
          var el = document.getElementById("boot-splash-pct");
          var splash = document.getElementById("boot-splash");
          if (!el || !splash || splash.classList.contains("is-done")) return;
          var elapsed = performance.now() - window.__bootSplashStartedAt;
          var pct = window.__bootSplashReady
            ? 100
            : elapsed >= 5000
              ? 99
              : (elapsed / 5000) * 99;
          el.textContent = Math.round(pct) + "%";
          if (pct < 100) requestAnimationFrame(tickBootPct);
        }
        requestAnimationFrame(tickBootPct);
      })();
    </script>
  </head>
  <body>
    <div class="boot-splash" id="boot-splash" aria-busy="true" aria-live="polite" role="status">
      <div class="boot-splash-stage">
        <div class="boot-splash-ring" aria-hidden="true"></div>
        <img class="boot-splash-logo" src="brand/atom-white.png" alt="" width="64" height="64" />
      </div>
      <p class="boot-splash-pct" id="boot-splash-pct">0%</p>
    </div>
    <div class="shell" id="desktop">
      <aside class="app-rail" id="app-rail" data-i18n-aria="shell.rail.apps" aria-label="Apps" aria-hidden="true">
        <button type="button" class="app-rail-scroll-btn" id="app-rail-up" data-i18n-title="shell.rail.scrollUp" data-i18n-aria="shell.rail.scrollUp" title="Scroll up" aria-label="Scroll up" hidden>▴</button>
        <div class="app-rail-scroll" id="app-rail-apps">
          <div class="app-rail-recent" id="app-rail-recent" data-i18n-aria="shell.rail.recent" aria-label="Recent apps"></div>
          <div class="app-rail-divider app-rail-divider--inset" id="app-rail-recent-divider" hidden aria-hidden="true"></div>
          <div class="app-rail-all" id="app-rail-all"></div>
        </div>
        <button type="button" class="app-rail-scroll-btn" id="app-rail-down" data-i18n-title="shell.rail.scrollDown" data-i18n-aria="shell.rail.scrollDown" title="Scroll down" aria-label="Scroll down" hidden>▾</button>
        <div class="app-rail-divider" aria-hidden="true"></div>
        <div class="app-rail-scroll app-rail-scroll--services" id="app-rail-services" data-i18n-aria="shell.rail.series" aria-label="Platform series"></div>
      </aside>
      <main class="workspace" data-i18n-aria="shell.frame.desktop" aria-label="Desktop">
        <section class="app-grid" id="app-grid"></section>
        <section class="app-frame hidden" id="app-frame" data-i18n-aria="shell.frame.application" aria-label="Application">
          <div class="app-frame-chrome" id="app-frame-chrome">
            <button type="button" class="frame-tool-btn frame-tool-btn--back" id="frame-back" data-i18n-title="shell.frame.backDesktop" title="Back to desktop">←</button>
            <div class="app-tab-strip" id="app-tab-strip" role="tablist" data-i18n-aria="shell.frame.tabs" aria-label="Open tabs"></div>
            <button type="button" class="frame-tool-btn frame-tool-btn--new" id="tab-new" data-i18n-title="shell.frame.newTab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
            <button type="button" class="frame-tool-btn" id="tab-snap" data-i18n-title="shell.frame.snap" title="Snap side by side">⧉</button>
          </div>
          <div class="app-frame-nav hidden" id="app-frame-nav">
            <button type="button" class="frame-tool-btn" id="frame-hist-back" data-i18n-title="shell.frame.histBack" title="Back" disabled aria-label="Back">◀</button>
            <button type="button" class="frame-tool-btn" id="frame-hist-forward" data-i18n-title="shell.frame.histForward" title="Forward" disabled aria-label="Forward">▶</button>
            <button type="button" class="frame-tool-btn" id="frame-home" data-i18n-title="shell.frame.home" title="My Space Browser home" aria-label="Home">&#8962;</button>
            <div class="frame-omnibox">
              <input
                type="text"
                id="frame-url"
                class="frame-url-input"
                data-i18n-placeholder="shell.frame.omnibox"
                placeholder="Search apps, commands, or enter a URL"
                spellcheck="false"
                autocomplete="off"
              />
              <div class="frame-omni-suggest hidden" id="frame-omni-suggest" role="listbox"></div>
            </div>
            <button type="button" class="frame-tool-btn" id="frame-go" data-i18n="shell.frame.go" data-i18n-title="shell.frame.go" title="Go">Go</button>
            <button type="button" class="frame-tool-btn frame-tool-btn--bookmark" id="frame-bookmark" data-i18n-title="shell.frame.bookmark" title="Bookmark (Ctrl+D)" aria-label="Bookmark" aria-pressed="false">&#9733;</button>
            <button type="button" class="frame-tool-btn" id="frame-refresh" data-i18n-title="shell.frame.refresh" title="Refresh (F5)">↻</button>
          </div>
          <div class="app-tab-panels" id="app-tab-panels"></div>
        </section>
        <div class="taskbar-peek hidden" id="taskbar-peek" aria-hidden="true">
          <div class="taskbar-peek-card">
            <p class="taskbar-peek-title" id="taskbar-peek-title"></p>
            <p class="taskbar-peek-meta" id="taskbar-peek-meta"></p>
            <div class="taskbar-peek-preview" id="taskbar-peek-preview"></div>
          </div>
        </div>
        <section class="panel hidden" id="builtin-panel">
          <button type="button" class="back-btn" id="back-btn" data-i18n="shell.backDesktop">Back to desktop</button>
          <div class="welcome-hub" id="welcome-hub">
            <header class="welcome-hero">
              <div class="welcome-hero-top">
                <p class="welcome-kicker" data-i18n="shell.welcome.kicker">My Space</p>
                <button type="button" class="welcome-platform-btn" id="btn-platform-services-welcome" data-i18n-title="shell.welcome.servicesTitle" title="Platform services">
                  <img src="brand/atom-white.png" alt="" width="16" height="16" />
                  <span data-i18n="shell.welcome.services">Services</span>
                </button>
              </div>
              <h2 id="welcome-title" data-i18n="shell.welcome.title">Command center</h2>
              <p id="welcome-subtitle" data-i18n="shell.welcome.subtitle">Your work environment for code and entrepreneurship.</p>
            </header>
            <div class="welcome-status" id="welcome-status" aria-live="polite"></div>
            <div class="welcome-layout">
              <section class="welcome-section welcome-section--apps">
                <div class="welcome-section-head">
                  <h3 data-i18n="shell.welcome.apps">Apps</h3>
                  <span class="welcome-section-meta" id="welcome-apps-count"></span>
                </div>
                <div class="welcome-apps" id="welcome-apps"></div>
              </section>
              <div class="welcome-side">
                <section class="welcome-section">
                  <div class="welcome-section-head">
                    <h3 data-i18n="shell.welcome.quick">Quick actions</h3>
                  </div>
                  <div class="welcome-actions" id="welcome-actions">
                    <button type="button" class="welcome-action" data-welcome-action="desktop" data-i18n="shell.welcome.desktop">Desktop</button>
                    <button type="button" class="welcome-action" data-welcome-action="start" data-i18n="shell.welcome.start">Start menu</button>
                    <button type="button" class="welcome-action" data-welcome-action="add" data-i18n="shell.welcome.add">Add program</button>
                    <button type="button" class="welcome-action" data-welcome-action="settings" data-i18n="shell.welcome.settings">Settings</button>
                    <button type="button" class="welcome-action" data-welcome-action="sysinfo" data-i18n="shell.welcome.sysinfo">System Info</button>
                  </div>
                </section>
                <section class="welcome-section">
                  <div class="welcome-section-head">
                    <h3 data-i18n="shell.welcome.openNow">Open now</h3>
                  </div>
                  <div class="welcome-running" id="welcome-running"></div>
                </section>
                <section class="welcome-section">
                  <div class="welcome-section-head">
                    <h3 data-i18n="shell.welcome.tips">Tips</h3>
                  </div>
                  <ul class="welcome-tips" id="welcome-tips"></ul>
                </section>
                <section class="welcome-section">
                  <div class="welcome-section-head">
                    <h3 data-i18n="shell.welcome.updates">Last updates</h3>
                  </div>
                  <div class="welcome-changelog" id="welcome-changelog"></div>
                </section>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer class="taskbar" role="toolbar" data-i18n-aria="shell.taskbar" aria-label="Taskbar">
        <div class="taskbar-section taskbar-section--start">
          <button type="button" class="taskbar-start" id="btn-start" data-i18n-title="shell.start.title" title="Start — add programs">
            <span class="taskbar-start-icon" aria-hidden="true">⊞</span>
          </button>
          <button type="button" class="taskbar-pin taskbar-connect" id="btn-connect" data-i18n-title="shell.connect.title" data-i18n-aria="shell.connect.aria" title="Connect — find services" aria-label="Open Connect">
            <svg class="taskbar-search-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" class="taskbar-pin" id="btn-settings" data-i18n-title="shell.settings.title" title="Settings">⚙</button>
          <button type="button" class="taskbar-pin taskbar-bell" id="btn-notifications" data-i18n-title="shell.notifications.title" data-i18n-aria="shell.notifications.aria" title="Notifications" aria-label="Notifications">
            <span class="taskbar-bell-badge" id="notifications-badge" hidden>0</span>
          </button>
          <button type="button" class="taskbar-pin taskbar-ask-ai" id="btn-ask-ai" data-i18n-title="shell.mind.title" data-i18n-aria="shell.mind.aria" title="Mind Chat" aria-label="Mind Chat" aria-expanded="false">
            <img class="taskbar-ask-ai-logo" src="brand/atom-rose.png" alt="" width="18" height="18" />
          </button>
        </div>
        <div class="taskbar-section taskbar-section--apps">
          <div id="taskbar-apps" class="taskbar-apps" data-i18n-aria="shell.apps.aria" aria-label="Open applications"></div>
        </div>
        <div class="taskbar-section taskbar-section--tray">
          <button type="button" class="taskbar-platform-btn" id="btn-platform-services" data-i18n-title="shell.platform.title" data-i18n-aria="shell.platform.aria" title="Platform services" aria-label="Platform services">
            <img src="brand/atom-white.png" alt="" width="16" height="16" />
          </button>
          <div class="taskbar-account-wrap" id="taskbar-account-wrap">
            <button
              type="button"
              class="taskbar-account-btn"
              id="btn-account"
              data-i18n-title="shell.account.title"
              data-i18n-aria="shell.account.aria"
              title="My Space account"
              aria-label="My Space account"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <img class="taskbar-account-avatar" id="account-avatar" src="brand/atom-white.png" alt="" width="18" height="18" />
              <span class="taskbar-account-label" id="account-label" data-i18n="shell.account.guest">Guest</span>
            </button>
            <div class="taskbar-account-menu hidden" id="account-menu" role="menu" data-i18n-aria="shell.account.menu" aria-label="Account">
              <p class="taskbar-account-menu-head" id="account-menu-head" data-i18n="shell.account.notSignedIn">Not signed in</p>
              <button type="button" class="taskbar-account-menu-item" id="account-sign-in" role="menuitem" data-i18n="shell.account.signIn">Sign in</button>
              <button type="button" class="taskbar-account-menu-item" id="account-create" role="menuitem" data-i18n="shell.account.create">Create account</button>
              <button type="button" class="taskbar-account-menu-item hidden" id="account-switch" role="menuitem" data-i18n="shell.account.switch">Switch account</button>
              <button type="button" class="taskbar-account-menu-item taskbar-account-menu-item--danger hidden" id="account-sign-out" role="menuitem" data-i18n="shell.account.signOut">Sign out</button>
            </div>
          </div>
          <span class="taskbar-tray-title" id="taskbar-title">My Space</span>
          <time class="taskbar-clock" id="clock" aria-live="polite"></time>
        </div>
      </footer>
    </div>
    <div class="os-account-sheet hidden" id="os-account-sheet" role="dialog" aria-modal="true" aria-labelledby="os-account-title">
      <div class="os-account-backdrop" id="os-account-backdrop"></div>
      <div class="os-account-card">
        <h2 id="os-account-title" class="os-account-title">
          <img class="os-account-logo" src="brand/atom-white.png" alt="" width="28" height="28" />
          <span data-i18n="shell.account.sheetTitle">My Space account</span>
        </h2>
        <p class="os-account-sub" id="os-account-sub" data-i18n="shell.account.sheetSub">Sign in to sync desktop settings to your profile</p>
        <div class="os-account-tabs" id="os-account-tabs">
          <button type="button" class="os-account-tab active" id="os-account-tab-signin" data-mode="signin" data-i18n="shell.account.signIn">Sign in</button>
          <button type="button" class="os-account-tab" id="os-account-tab-register" data-mode="register" data-i18n="shell.account.create">Create account</button>
        </div>
        <form class="os-account-form" id="os-account-form">
          <label class="os-account-label" for="os-account-username" data-i18n="shell.account.username">Username</label>
          <input type="text" id="os-account-username" class="os-account-input" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+" />
          <label class="os-account-label" for="os-account-password" data-i18n="shell.account.password">Password</label>
          <input type="password" id="os-account-password" class="os-account-input" autocomplete="current-password" required minlength="6" />
          <label class="os-account-label hidden" for="os-account-password2" id="os-account-label-password2" data-i18n="shell.account.confirmPassword">Confirm password</label>
          <input type="password" id="os-account-password2" class="os-account-input hidden" autocomplete="new-password" minlength="6" />
          <label class="os-account-check">
            <input type="checkbox" id="os-account-remember" checked />
            <span data-i18n="shell.account.remember">Keep me signed in</span>
          </label>
          <p class="os-account-error hidden" id="os-account-error" role="alert"></p>
          <button type="submit" class="os-account-submit" id="os-account-submit" data-i18n="shell.account.continue">Continue</button>
          <button type="button" class="os-account-cancel" id="os-account-cancel" data-i18n="shell.account.cancel">Cancel</button>
        </form>
      </div>
    </div>
