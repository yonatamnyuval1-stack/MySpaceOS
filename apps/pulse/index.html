<!DOCTYPE html>
<html lang="en" data-theme="light" data-buttons="default" data-theme-base="light" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/theme-chrome.css?v=20260825v3" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="logo.png" width="36" height="36" alt="" />
          <div>
            <strong>Pulse</strong>
            <span class="brand-sub">Internal &amp; external</span>
          </div>
        </div>

        <nav class="nav" id="main-nav" aria-label="Pulse">
          <button type="button" class="nav-item active" data-page="directory">Apps</button>
          <button type="button" class="nav-item" data-page="external">External</button>
          <button type="button" class="nav-item" data-page="activity">Recent activity</button>
        </nav>

        <footer class="sidebar-foot">
          <p id="sidebar-blurb">Apps inside My Space, plus Composio tools outside it.</p>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-text">
            <button type="button" class="back-btn hidden" id="btn-back" aria-label="Back">← Back</button>
            <div>
              <h1 id="page-title">Apps on Pulse</h1>
              <p class="subtitle" id="page-subtitle">Each app lists the commands it accepts</p>
            </div>
          </div>
          <div class="topbar-actions">
            <input type="search" id="search-input" class="search" placeholder="Search apps…" spellcheck="false" />
            <button type="button" class="btn" id="btn-reload">Refresh</button>
          </div>
        </header>

        <div class="banner hidden" id="banner" role="alert"></div>
        <div class="content" id="content"></div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
