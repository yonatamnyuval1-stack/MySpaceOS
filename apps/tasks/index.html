<!DOCTYPE html>
<html lang="en" data-theme="dark" data-buttons="default" data-theme-base="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/theme-chrome.css?v=20260825v3" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="logo.svg" width="32" height="32" alt="" />
          <div>
            <strong>Tasks</strong>
            <span class="brand-sub">GTD · projects</span>
          </div>
        </div>

        <nav class="nav nav--primary" id="smart-nav" aria-label="Smart lists">
          <button type="button" class="nav-item active" data-view="inbox">
            Inbox <em id="count-inbox">0</em>
          </button>
          <button type="button" class="nav-item" data-view="next">
            Next <em id="count-next">0</em>
          </button>
          <button type="button" class="nav-item" data-view="today">
            Due today <em id="count-today">0</em>
          </button>
          <button type="button" class="nav-item" data-view="waiting">
            Waiting <em id="count-waiting">0</em>
          </button>
        </nav>

        <div class="nav-more" id="nav-more">
          <button type="button" class="nav-more-toggle" id="nav-more-toggle" aria-expanded="false">
            More lists
            <span class="nav-more-chevron" aria-hidden="true">▾</span>
          </button>
          <nav class="nav nav--secondary hidden" id="smart-nav-more" aria-label="More lists">
            <button type="button" class="nav-item" data-view="someday">
              Someday <em id="count-someday">0</em>
            </button>
            <button type="button" class="nav-item" data-view="upcoming">
              Upcoming <em id="count-upcoming">0</em>
            </button>
            <button type="button" class="nav-item" data-view="flagged">
              Flagged <em id="count-flagged">0</em>
            </button>
            <button type="button" class="nav-item" data-view="all">
              All active <em id="count-all">0</em>
            </button>
            <button type="button" class="nav-item nav-item--muted" data-view="done">
              Completed <em id="count-done">0</em>
            </button>
          </nav>
        </div>

        <p class="nav-section-label">Projects</p>
        <div class="nav-section-head">
          <button type="button" class="btn-text" id="btn-add-project">+ Project</button>
        </div>
        <nav class="nav nav--projects" id="project-list" aria-label="Projects"></nav>

        <footer class="sidebar-foot">
          <p>Ctrl+N capture · Today = timed agenda</p>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-text">
            <h1 id="list-title">Inbox</h1>
            <p class="subtitle" id="list-sub">Clarify into next actions</p>
          </div>
          <div class="topbar-actions">
            <button type="button" class="btn btn-ghost btn-icon" id="btn-search-toggle" title="Search">⌕</button>
            <button type="button" class="btn btn-ghost" id="btn-add-list" hidden>+ List</button>
            <button type="button" class="btn btn-primary" id="btn-new" title="New task (Ctrl+N)">Add task</button>
          </div>
        </header>

        <div class="main-body">
          <form class="capture" id="capture-form" autocomplete="off">
            <input
              type="text"
              id="capture-input"
              class="capture-input"
              placeholder="Capture a task…"
              spellcheck="true"
            />
            <button type="submit" class="btn btn-primary capture-submit" aria-label="Add">↵</button>
          </form>

          <div class="toolbar hidden" id="search-toolbar">
            <div class="search-wrap">
              <input type="search" id="search-input" class="search" placeholder="Search tasks…" autocomplete="off" />
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-search-close">Close</button>
          </div>

          <div class="task-list" id="task-list" role="list"></div>
          <div class="empty-state hidden" id="empty-list">
            <h3>Clear</h3>
            <p>Capture above or press Ctrl+N.</p>
          </div>
        </div>
      </main>

      <aside class="detail-panel hidden" id="editor-pane" aria-label="Task detail">
        <div class="editor" id="editor">
          <header class="detail-head">
            <button type="button" class="btn btn-ghost btn-icon detail-close" id="btn-close-detail" title="Close">×</button>
            <div class="bucket-chips" id="bucket-chips" role="group" aria-label="Bucket">
              <button type="button" class="chip" data-bucket="inbox">Inbox</button>
              <button type="button" class="chip" data-bucket="next">Next</button>
              <button type="button" class="chip" data-bucket="waiting">Waiting</button>
              <button type="button" class="chip" data-bucket="someday">Someday</button>
            </div>
            <span class="save-status" id="save-status" aria-live="polite"></span>
          </header>

          <div class="detail-body editor-body">
            <input
              type="text"
              id="task-title"
              class="task-title"
              placeholder="Task title"
              autocomplete="off"
              spellcheck="true"
            />
            <textarea
              id="task-notes"
              class="task-notes"
              placeholder="Notes…"
              spellcheck="true"
            ></textarea>

            <div class="checklist-block">
              <ul class="checklist" id="checklist"></ul>
              <form class="checklist-add" id="checklist-form" autocomplete="off">
                <input type="text" id="checklist-input" placeholder="Sub-step…" maxlength="200" />
                <button type="submit" class="btn btn-ghost btn-sm">Add</button>
              </form>
            </div>

            <details class="props-panel" id="props-panel">
              <summary>Details</summary>
              <div class="props-grid">
                <label class="field">
                  <span>Project</span>
                  <select id="task-project" class="field-select"></select>
                </label>
                <label class="field">
                  <span>List</span>
                  <select id="task-list" class="field-select"></select>
                </label>
                <label class="field">
                  <span>Priority</span>
                  <select id="task-priority" class="field-select">
                    <option value="0">None</option>
                    <option value="1">Low</option>
                    <option value="2">Medium</option>
                    <option value="3">High</option>
                  </select>
                </label>
                <label class="field">
                  <span>Due date</span>
                  <input type="date" id="task-due" class="field-input" />
                </label>
                <label class="field field--full hidden" id="waiting-field">
                  <span>Waiting on</span>
                  <input type="text" id="task-waiting" class="field-input" placeholder="Person or blocker…" autocomplete="off" />
                </label>
                <label class="field field--full">
                  <span>Tags</span>
                  <input type="text" id="task-tags" class="field-input" placeholder="#work, #home" autocomplete="off" />
                </label>
              </div>
            </details>

            <footer class="editor-meta" id="editor-meta"></footer>
          </div>

          <footer class="detail-foot">
            <button type="button" class="btn btn-ghost btn-sm" id="btn-flag" title="Flag">Flag</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-schedule" title="Send to Today">→ Today</button>
            <button type="button" class="btn btn-primary" id="btn-complete">Done</button>
            <button type="button" class="btn-text btn-text--danger" id="btn-delete">Delete</button>
          </footer>
        </div>
      </aside>
    </div>

    <select id="task-bucket" class="hidden" aria-hidden="true" tabindex="-1">
      <option value="inbox">Inbox</option>
      <option value="next">Next</option>
      <option value="waiting">Waiting</option>
      <option value="someday">Someday</option>
    </select>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <dialog class="modal" id="confirm-modal">
      <form method="dialog" id="confirm-form" class="modal-card">
        <h3 id="confirm-title">Delete task?</h3>
        <p class="modal-copy" id="confirm-copy">This cannot be undone.</p>
        <div class="modal-actions">
          <button type="submit" class="btn btn-danger" id="confirm-ok" value="ok">Delete</button>
          <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="project-modal">
      <form method="dialog" id="project-form" class="modal-card">
        <h3>New project</h3>
        <label>
          <span>Name</span>
          <input type="text" id="project-name" required maxlength="80" placeholder="e.g. Website relaunch" />
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" value="ok">Create</button>
          <button type="button" class="btn btn-ghost" id="project-cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="list-modal">
      <form method="dialog" id="list-form" class="modal-card">
        <h3>New list</h3>
        <label>
          <span>Name</span>
          <input type="text" id="list-name" required maxlength="80" placeholder="e.g. Design" />
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" value="ok">Create</button>
          <button type="button" class="btn btn-ghost" id="list-cancel">Cancel</button>
        </div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
