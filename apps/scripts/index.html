<!DOCTYPE html>
<html lang="en" data-theme="dark" data-buttons="default" data-theme-base="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/theme-chrome.css?v=20260825v3" />
    <link rel="stylesheet" href="../shared/settings-panel.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <strong data-i18n="platform.scripts.name">Runtime</strong>
            <span class="brand-sub" data-i18n="platform.scripts.tagline">OS language &amp; host tools</span>
          </div>
        </div>
        <nav class="mode-strip" id="mode-strip" role="tablist" aria-label="Runtime modes">
          <button
            type="button"
            class="mode-tab is-active"
            role="tab"
            id="mode-programs"
            data-mode="programs"
            aria-selected="true"
            data-i18n="service.scripts.modePrograms"
          >
            Programs
          </button>
          <button
            type="button"
            class="mode-tab"
            role="tab"
            id="mode-session"
            data-mode="session"
            aria-selected="false"
            data-i18n="service.scripts.modeSession"
          >
            Session
          </button>
        </nav>
        <div class="tree-toolbar">
          <span class="tree-root-label" data-i18n="service.scripts.treeRoot">Programs</span>
          <div class="tree-toolbar-actions">
            <button
              type="button"
              class="tree-action"
              id="btn-new"
              title="New program"
              data-i18n-title="service.scripts.new"
              aria-label="New program"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M4 1.5A1.5 1.5 0 0 0 2.5 3v10A1.5 1.5 0 0 0 4 14.5h8A1.5 1.5 0 0 0 13.5 13V5.207L10.293 2H4A.5.5 0 0 0 3.5 2.5v11A.5.5 0 0 0 4 14h8a.5.5 0 0 0 .5-.5V5.5H9.5A1.5 1.5 0 0 1 8 4V1.5H4zm5 .207V4a.5.5 0 0 0 .5.5h2.293L9 1.707z"
                />
                <path fill="currentColor" d="M8.5 8.5V7h-1v1.5H6v1h1.5V11h1V9.5H10v-1H8.5z" />
              </svg>
            </button>
            <button
              type="button"
              class="tree-action"
              id="btn-new-folder"
              title="New folder"
              data-i18n-title="service.scripts.newFolder"
              data-i18n-aria="service.scripts.newFolder"
              aria-label="New folder"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M1.5 3A1.5 1.5 0 0 1 3 1.5h3.172a1.5 1.5 0 0 1 1.06.44L8.5 3H13A1.5 1.5 0 0 1 14.5 4.5v.5H2v7.5A.5.5 0 0 0 2.5 13h11a.5.5 0 0 0 .5-.5V5H15v7.5A1.5 1.5 0 0 1 13.5 14h-11A1.5 1.5 0 0 1 1 12.5v-9z"
                />
                <path fill="currentColor" d="M8.75 7.25v1.5h1.5v1h-1.5v1.5h-1v-1.5h-1.5v-1h1.5v-1.5h1z" />
              </svg>
            </button>
            <button
              type="button"
              class="tree-action"
              id="btn-import-file"
              title="Import file"
              data-i18n-title="service.scripts.importFile"
              data-i18n-aria="service.scripts.importFile"
              aria-label="Import file"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M8.5 1.5v7.793l2.146-2.147.708.708L8 11.207 4.646 7.854l.708-.708L7.5 9.293V1.5h1zM3 12.5h10V14H3v-1.5z"
                />
              </svg>
            </button>
            <button
              type="button"
              class="tree-action"
              id="btn-import-folder"
              title="Import folder"
              data-i18n-title="service.scripts.importFolder"
              data-i18n-aria="service.scripts.importFolder"
              aria-label="Import folder"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M1.5 3A1.5 1.5 0 0 1 3 1.5h3.172a1.5 1.5 0 0 1 1.06.44L8.5 3H13A1.5 1.5 0 0 1 14.5 4.5v.75H2v7.25A.5.5 0 0 0 2.5 13h11a.5.5 0 0 0 .5-.5V6H15v6.5A1.5 1.5 0 0 1 13.5 14h-11A1.5 1.5 0 0 1 1 12.5v-9z"
                />
                <path
                  fill="currentColor"
                  d="M8.5 5.5v3.793l1.146-1.147.708.708L8 11.207 5.646 8.854l.708-.708L7.5 9.293V5.5h1z"
                />
              </svg>
            </button>
            <button
              type="button"
              class="tree-action"
              id="btn-collapse-all"
              title="Collapse All"
              data-i18n-title="service.scripts.collapseAll"
              data-i18n-aria="service.scripts.collapseAll"
              aria-label="Collapse All"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M1 4.5 8 1l7 3.5v1.25L8 2.25 1 5.75V4.5zm0 4L8 5.5l7 3v1.25L8 6.75 1 9.75V8.5zm0 4L8 9.5l7 3V13.75L8 10.75 1 13.75V12.5z"
                />
              </svg>
            </button>
          </div>
        </div>
        <nav class="script-list file-tree" id="script-list" aria-label="Saved programs"></nav>
        <footer class="sidebar-foot">
          <p data-i18n="service.scripts.foot">Language programs that drive My Space</p>
        </footer>
      </aside>
      <main class="main">
        <div class="mode-panel is-active" id="panel-programs" data-panel="programs" role="tabpanel">
          <input type="hidden" id="script-name" value="" />
          <input type="checkbox" id="stop-on-error" checked hidden />
          <div class="workspace is-terminal-closed" id="programs-workspace">
            <section class="editor-pane">
              <div class="editor-tabs" id="editor-tabs" role="tablist" aria-label="Open editors"></div>
              <nav class="editor-breadcrumbs" id="editor-breadcrumbs" aria-label="Breadcrumb" hidden></nav>
              <div class="editor-code" id="editor-code">
                <div class="editor-gutter" id="editor-gutter" aria-hidden="true"></div>
                <label class="sr-only" for="script-body">Program body</label>
                <textarea
                  id="script-body"
                  class="script-editor"
                  spellcheck="false"
                  autocomplete="off"
                  wrap="off"
                  data-i18n-placeholder="service.scripts.bodyPlaceholder"
                  placeholder="# One Language command per line"
                ></textarea>
              </div>
            </section>
            <div class="panel-bar" role="tablist" aria-label="Panels">
              <button
                type="button"
                class="panel-tab"
                id="btn-show-terminal"
                role="tab"
                aria-selected="false"
                data-i18n="service.scripts.showTerminal"
                data-i18n-aria="service.scripts.showTerminal"
              >
                Terminal
              </button>
            </div>
            <section class="output-pane is-closed" id="output-pane" hidden>
              <div class="output-head">
                <h2 data-i18n="service.scripts.output">Terminal</h2>
                <div class="output-head-actions">
                  <label class="check-row check-row-compact" title="Stop when a step fails">
                    <input type="checkbox" id="stop-on-error-ui" checked />
                    <span data-i18n="service.scripts.stopOnError">Stop on error</span>
                  </label>
                  <button type="button" class="btn btn-ghost btn-sm" id="btn-clear-log" data-i18n="service.scripts.clear">Clear</button>
                  <button
                    type="button"
                    class="btn btn-ghost btn-sm"
                    id="btn-close-terminal"
                    data-i18n="service.scripts.closeTerminal"
                    aria-label="Close terminal"
                  >
                    Close
                  </button>
                </div>
              </div>
              <div class="output-log" id="output-log" aria-live="polite">
                <p class="output-empty" data-i18n="service.scripts.outputEmpty">Run a program to see each step here.</p>
              </div>
            </section>
            <footer class="editor-statusbar" id="editor-statusbar" role="status" aria-live="polite">
              <div class="statusbar-left">
                <span class="statusbar-item" id="statusbar-path"></span>
              </div>
              <div class="statusbar-right">
                <span class="statusbar-item" id="statusbar-cursor">Ln 1, Col 1</span>
                <span class="statusbar-item" id="statusbar-lang">MSOS</span>
              </div>
            </footer>
          </div>
        </div>
        <div class="mode-panel" id="panel-session" data-panel="session" role="tabpanel" hidden>
          <header class="topbar session-topbar">
            <div class="topbar-text">
              <h1 class="session-title" data-i18n="service.scripts.sessionTitle">Session</h1>
              <p class="subtitle" data-i18n="service.scripts.sessionSubtitle">
                Language runs and host tool output for this OS.
              </p>
            </div>
            <div class="topbar-actions">
              <button type="button" class="btn btn-ghost btn-sm" id="btn-clear-session" data-i18n="service.scripts.clearSession">
                Clear session
              </button>
            </div>
          </header>
          <div class="session-body">
            <div class="session-log" id="session-log" aria-live="polite">
              <div class="session-empty" id="session-empty">
                <p data-i18n="service.scripts.sessionEmpty">
                  Output from Language and host runs will appear here.
                </p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="tree-context-menu" class="tree-context-menu" hidden role="menu"></div>
    <script src="../shared/i18n/locales/en.js"></script>
    <script src="../shared/i18n/locales/he.js"></script>
    <script src="../shared/i18n/locales/ar.js"></script>
    <script src="../shared/i18n/locales/fr.js"></script>
    <script src="../shared/i18n/locales/ru.js"></script>
    <script src="../shared/i18n/locales/es.js"></script>
    <script src="../shared/i18n/languages.js"></script>
    <script src="../shared/i18n/i18n.js"></script>
    <script src="../shared/i18n/sync-boot.js"></script>
    <script src="../shared/i18n/auto-mark.js"></script>
    <script src="../shared/i18n/boot-service.js"></script>
    <script src="app.js"></script>
  </body>
</html>
