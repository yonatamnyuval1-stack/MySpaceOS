<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Space — Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <img class="hero-mark" src="atom-white.png" alt="" width="56" height="56" />
      <p class="hero-brand">My Space</p>
      <h1 class="hero-line">A personal desktop layer on Windows</h1>
      <p class="hero-sub">Screenshot walkthrough — or download the Windows installer.</p>
      <p class="hero-actions">
        <a
          class="btn btn-primary"
          href="https://github.com/yonatamnyuval1-stack/MySpaceOS/releases/latest"
          >Download for Windows (.exe)</a
        >
        <a
          class="btn btn-ghost"
          href="https://github.com/yonatamnyuval1-stack/MySpaceOS"
          >View source</a
        >
      </p>
    </header>
    <main class="tour">
      <figure class="shot">
        <img
          src="../screenshots/01-desktop.png"
          alt="My Space desktop with app icons, wallpaper, and taskbar"
          width="1600"
          height="900"
          loading="eager"
        />
        <figcaption>
          <span class="shot-num">01</span>
          Desktop: apps, wallpaper, taskbar, virtual desktops
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/02-account-signin.png"
          alt="My Space account sign-in dialog on the desktop"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">02</span>
          My Space OS account: sign in / create on this PC
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/03-platform-services.png"
          alt="Platform services catalog overlay"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">03</span>
          Platform services catalog (Jobs, Files, Themes, …)
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/04-connect.png"
          alt="Connect catalog with mail and messaging apps"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">04</span>
          Connect: open web apps inside My Space
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/05-settings-general.png"
          alt="General settings for space name and desktop behavior"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">05</span>
          Settings: space name, desktop behavior, defaults
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/06-browser-home.png"
          alt="My Space Browser home with search and quick links"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">06</span>
          My Space Browser home: search apps, Connect, and the web
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/07-docs.png"
          alt="In-app Docs handbook page What is My Space"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">07</span>
          In-app Docs handbook (mental model, quick start, platform)
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/08-code-lexicon.png"
          alt="Code Lexicon search grid of programming concepts"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">08</span>
          Code Lexicon: browse programming concepts
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/09-runtime.png"
          alt="Runtime editor with .msos programs and terminal"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">09</span>
          Runtime: edit and run .msos programs
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/10-mind-chat.png"
          alt="Mind Chat empty conversation with Companion mode"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">10</span>
          Mind Chat: AI assistant (Gemini key in Mind → Setup)
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/11-shell-overview.png"
          alt="Shell overview atlas for My Space Language"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">11</span>
          Shell atlas: My Space Language map
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/12-themes-apps.png"
          alt="Themes app grid for per-app light and dark modes"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">12</span>
          Themes: per-app light/dark and button styles
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/13-permissions-ai.png"
          alt="Permissions AI tools toggles for Mind side assistant"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">13</span>
          Permissions: gate what Mind tools may do
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/14-info-catalog.png"
          alt="Info catalog of apps, services, and externals"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">14</span>
          Info catalog: apps, services, and externals
        </figcaption>
      </figure>
      <figure class="shot">
        <img
          src="../screenshots/15-updates-history.png"
          alt="Updates history changelog of applied releases"
          width="1600"
          height="900"
          loading="lazy"
        />
        <figcaption>
          <span class="shot-num">15</span>
          Updates history: changelog of applied releases
        </figcaption>
      </figure>
    </main>
  </body>
</html>
